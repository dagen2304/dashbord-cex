services:
  # ----------------------------------------------------
  # Base de données PostgreSQL (Inventaire & Utilisateurs)
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: noc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noc_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-noc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - noc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noc_admin} -d ${POSTGRES_DB:-noc_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # Base de données Time-Series InfluxDB (Métriques Temps Réel)
  # ----------------------------------------------------
  influxdb:
    image: influxdb:2.7-alpine
    container_name: noc_influxdb
    restart: always
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE:-setup}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-noc_operator}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD:?DOCKER_INFLUXDB_INIT_PASSWORD est requis dans .env}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-noc_org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-noc_metrics}
      - DOCKER_INFLUXDB_INIT_RETENTION=${DOCKER_INFLUXDB_INIT_RETENTION:-30d}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:?DOCKER_INFLUXDB_INIT_ADMIN_TOKEN est requis dans .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - noc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------
  # Redis Broker (Celery & Caching)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: noc_redis
    restart: always
    networks:
      - noc_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------
  # API Backend FastAPI
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noc_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL est requis dans .env}
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN est requis dans .env}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-noc_org}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-noc_metrics}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY est requis dans .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY est requis dans .env}
    depends_on:
      db:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - noc_network
    deploy:
      resources:
        limits:
          memory: 1G

  # ----------------------------------------------------
  # Celery Worker (Exécution des tâches de polling)
  # ----------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noc_celery_worker
    restart: always
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL est requis dans .env}
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN est requis dans .env}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-noc_org}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-noc_metrics}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY est requis dans .env}
    depends_on:
      db:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - noc_network
    deploy:
      resources:
        limits:
          memory: 2G

  # ----------------------------------------------------
  # Celery Beat (Planificateur de Polling Récurrent)
  # ----------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noc_celery_beat
    restart: always
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL est requis dans .env}
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN est requis dans .env}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-noc_org}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-noc_metrics}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY est requis dans .env}
    depends_on:
      db:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - noc_network
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------
  # Frontend React (Vite build → Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noc_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - noc_network
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  influxdb_data:

networks:
  noc_network:
    driver: bridge
