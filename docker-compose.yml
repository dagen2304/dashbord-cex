# NOC INFRA Dashboard — orchestration PRODUCTION
# Un seul point d'entrée : Nginx (port 80) sert l'interface et relaie /api vers le backend.
# PostgreSQL, Redis, InfluxDB et l'API ne sont pas exposés sur l'hôte.

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est requis dans .env}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  INFLUXDB_URL: ${INFLUXDB_URL:-http://influxdb:8086}
  INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN est requis dans .env}
  INFLUXDB_ORG: ${INFLUXDB_ORG:-noc_org}
  INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-noc_metrics}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est requis dans .env}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis dans .env}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  # Active Directory (désactivé par défaut) — voir .env.example
  LDAP_ENABLED: ${LDAP_ENABLED:-false}
  LDAP_URL: ${LDAP_URL:-}
  LDAP_START_TLS: ${LDAP_START_TLS:-false}
  LDAP_CA_FILE: ${LDAP_CA_FILE:-}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
  LDAP_GROUP_ADMIN: ${LDAP_GROUP_ADMIN:-}
  LDAP_GROUP_OPERATOR: ${LDAP_GROUP_OPERATOR:-}
  LDAP_GROUP_VIEWER: ${LDAP_GROUP_VIEWER:-}
  LDAP_DOMAIN_LABEL: ${LDAP_DOMAIN_LABEL:-}
  DEMO_DATA: ${DEMO_DATA:-false}
  # AC interne des équipements (fichier PEM monté dans les conteneurs), ex. /certs/ac-interne.pem
  DEVICE_CA_BUNDLE: ${DEVICE_CA_BUNDLE:-}
  TZ: Africa/Douala

x-backend-deps: &backend-deps
  db:
    condition: service_healthy
  influxdb:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: postgres:15-alpine
    container_name: noc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noc_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-noc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [noc_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noc_admin} -d ${POSTGRES_DB:-noc_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  influxdb:
    image: influxdb:2.7-alpine
    container_name: noc_influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME:-noc_operator}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD:?DOCKER_INFLUXDB_INIT_PASSWORD est requis dans .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-noc_org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-noc_metrics}
      DOCKER_INFLUXDB_INIT_RETENTION: ${DOCKER_INFLUXDB_INIT_RETENTION:-90d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN est requis dans .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks: [noc_network]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: noc_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    networks: [noc_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: noc-backend:latest
    container_name: noc_backend
    restart: always
    environment: *backend-env
    depends_on: *backend-deps
    networks: [noc_network]
    deploy:
      resources:
        limits:
          memory: 1G

  celery_worker:
    image: noc-backend:latest
    container_name: noc_celery_worker
    # L'image hérite du healthcheck HTTP de l'API (:8000), qui n'a pas de sens ici.
    healthcheck:
      disable: true
    restart: always
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=8
    environment: *backend-env
    depends_on:
      <<: *backend-deps
      backend:
        condition: service_started
    networks: [noc_network]
    deploy:
      resources:
        limits:
          memory: 2G

  celery_beat:
    image: noc-backend:latest
    container_name: noc_celery_beat
    # L'image hérite du healthcheck HTTP de l'API (:8000), qui n'a pas de sens ici.
    healthcheck:
      disable: true
    restart: always
    # Fichier d'état de Beat dans /tmp : l'utilisateur non-root ne peut pas écrire dans /app.
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      <<: *backend-deps
      backend:
        condition: service_started
    networks: [noc_network]
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build: ./frontend
    container_name: noc_frontend
    restart: always
    ports:
      # HTTP_BIND=127.0.0.1 : port accessible depuis le serveur seulement (ex. derrière
      # Traefik/Dokploy, qui joint le conteneur par le réseau Docker).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    depends_on:
      - backend
    networks: [noc_network]
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  influxdb_data:

networks:
  noc_network:
    driver: bridge
