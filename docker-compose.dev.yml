# Développement : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Ports des services internes exposés pour le débogage, rechargement à chaud du code.
services:
  db:
    ports: ["5432:5432"]
  influxdb:
    ports: ["8086:8086"]
  redis:
    ports: ["6379:6379"]
  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
  celery_worker:
    volumes: ["./backend:/app"]
  celery_beat:
    volumes: ["./backend:/app"]
